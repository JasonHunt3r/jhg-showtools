# BGTools: plays ShowTools shows as the desktop picture (spec/bgtools.md).
#   BGTools/build.sh    → build/BGTools.app
name: BGTools
options:
  bundleIdPrefix: com.jhg
  deploymentTarget:
    macOS: "26.0"
packages:
  ShowTools:
    path: ..
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CURRENT_PROJECT_VERSION: "2"
    MARKETING_VERSION: "0.1"
targets:
  BGTools:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ShowTools
        product: ShowToolsCore
      - package: ShowTools
        product: ShowToolsPlayback
      - package: ShowTools
        product: BGToolsCore
      - target: BGToolsControls
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhg.bgtools
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BGTools
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jhg.bgtools
            CFBundleURLSchemes: [bgtools]
  BGToolsControls:
    type: app-extension
    platform: macOS
    sources: [Controls]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jhg.bgtools.controls
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BGTools
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: BGTools
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/BGToolsControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Reads the on/off state BGTools writes for the tiles; nothing else.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/BGTools/
